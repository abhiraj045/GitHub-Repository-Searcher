spring.application.name=github-repo-searcher

# ---- PostgreSQL (override with environment variables if needed) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# server.port=8083
   server.port=${PORT:8083}
   server.forward-headers-strategy=framework

# ---- GitHub API ----
github.api.base-url=https://api.github.com
# Optional personal access token: raises rate limit from 10 to 30 search requests/minute
github.api.token=${GITHUB_TOKEN:}
github.api.default-per-page=30
